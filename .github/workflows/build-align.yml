name: Build Align Preview APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-align.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use runner Android SDK
        timeout-minutes: 3
        run: |
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -f "$ANDROID_HOME/build-tools/35.0.0/aapt2" ]; then
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - name: Restore bundled assets and current source
        shell: python
        run: |
          import base64, hashlib, io, pathlib, zipfile
          base = pathlib.Path('Align-0.4.0.apk').read_bytes()
          assert hashlib.sha256(base).hexdigest() == '203f69508e76eb652dcb69511e43d254f18761ab4445ed7e94119f7e7831083f', 'Unexpected base APK'
          out = pathlib.Path('align-build')
          out.mkdir()
          with zipfile.ZipFile(io.BytesIO(base)) as archive:
              for name in archive.namelist():
                  if name.startswith('assets/') and not name.endswith('/'):
                      target = out / name
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(archive.read(name))
          payload = ''
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as archive:
              archive.extractall(out)
      - name: Compile and sign test APK
        shell: bash
        run: |
          set -euo pipefail
          cd align-build
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p classes dex
          javac -source 8 -target 8 -cp "$PLATFORM" -d classes src/com/align/motion/MainActivity.java
          "$BT/d8" --lib "$PLATFORM" --min-api 26 --output dex $(find classes -name '*.class')
          "$BT/aapt2" link -o unsigned.apk -I "$PLATFORM" --manifest AndroidManifest.xml -A assets resources.zip
          (cd dex && zip ../unsigned.apk classes.dex)
          "$BT/zipalign" -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore preview.jks -storepass android -keypass android -alias preview -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Align Preview"
          "$BT/apksigner" sign --ks preview.jks --ks-key-alias preview --ks-pass pass:android --key-pass pass:android --out Align-0.8.0-preview.apk aligned.apk
          "$BT/apksigner" verify --verbose Align-0.8.0-preview.apk
          sha256sum Align-0.8.0-preview.apk > SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Align-0.8.0-preview
          path: |
            align-build/Align-0.8.0-preview.apk
            align-build/SHA256.txt
          retention-days: 30
